    functional_form: "coordination pattern variable"
    value_range:
      - distributed_peer
      - temporary_coordination
      - functional_specialization
      - hierarchical_delegation
      - rigid_command_chain
    depends_on:
      - information_distribution
      - problem_complexity
      - failure_tolerance
      - scale
      - coordination_cost
