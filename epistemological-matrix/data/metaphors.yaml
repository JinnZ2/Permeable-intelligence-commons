# metaphors.yaml - Canonical reified metaphor catalog
# Part of the Permeable Intelligence Commons
#
# Each metaphor has 8 fields:
#   reified_as          - How it's currently treated (constant form)
#   functional_form     - What it actually is (variable form)
#   value_range         - Possible values across the spectrum
#   depends_on          - Contextual factors it depends on
#   institutional_function - Why this reification serves institutions
#   detection_patterns  - Regex patterns for base detection
#   reified_contexts    - Regex patterns where the term IS reified (boosts confidence)
#   functional_contexts - Regex patterns where the term is used functionally (reduces confidence)

schema_version: "2.0"

metaphors:

  boundaries:
    reified_as: "fixed separation"
    functional_form: "permeability spectrum"
    value_range:
      - fully_open
      - contextually_permeable
      - selectively_filtered
      - temporarily_closed
      - rigid_separation
    depends_on:
      - context
      - relationship_type
      - cultural_framework
      - purpose
      - trust_level
    institutional_function: "justifies rigid separation as natural/necessary, enables control through isolation"
    detection_patterns:
      - "\\bboundaries\\b"
      - "\\bmaintain boundaries\\b"
      - "\\bprotective barriers\\b"
      - "\\bclear boundaries\\b"
    reified_contexts:
      - "\\bmaintain\\s+boundaries\\b"
      - "\\brespect\\s+(the\\s+)?boundaries\\b"
      - "\\bclear\\s+boundaries\\b"
      - "\\brigid\\s+boundaries\\b"
      - "\\bset\\s+boundaries\\b"
      - "\\benforce\\s+boundaries\\b"
      - "\\bprotective\\s+barriers\\b"
      - "\\bboundaries\\s+(with|between|for)\\b"
    functional_contexts:
      - "\\bboundaries\\s+of\\s+(this|the|a)\\s+\\w+"
      - "\\bwithin\\s+the\\s+boundaries\\b"
      - "\\bboundary\\s+(condition|value|layer|element)\\b"
      - "\\bupper\\s+bound"
      - "\\blower\\s+bound"
      - "\\bbounded\\s+by\\b"

  intelligence:
    reified_as: "unitary measurable quantity"
    functional_form: "architecture-problem fitness matrix"
    value_range:
      - pattern_recognition
      - adaptation_speed
      - context_integration
      - distributed_coordination
      - specialized_optimization
    depends_on:
      - problem_structure
      - information_availability
      - architectural_type
      - measurement_method
      - cultural_framework
    institutional_function: "enables ranking/hierarchy claims, justifies concentration of power/resources"
    detection_patterns:
      - "\\bintelligence\\b"
      - "\\bmore intelligent\\b"
      - "\\bAGI\\b"
      - "\\bgeneral intelligence\\b"
      - "\\bIQ\\b"
    reified_contexts:
      - "\\bmore\\s+intelligent\\b"
      - "\\blevel\\s+of\\s+intelligence\\b"
      - "\\bmeasure\\s+(of\\s+)?intelligence\\b"
      - "\\bintelligence\\s+(is|as)\\b"
      - "\\bsuperior\\s+intelligence\\b"
      - "\\bhuman(-level)?\\s+intelligence\\b"
      - "\\bartificial\\s+general\\s+intelligence\\b"
    functional_contexts:
      - "\\bintelligence\\s+(agency|service|community|report)\\b"
      - "\\bthreat\\s+intelligence\\b"
      - "\\bbusiness\\s+intelligence\\b"
      - "\\bintelligence\\s+gathering\\b"

  centralized:
