      - "\\bhierarchy\\b"
      - "\\bchain of command\\b"
      - "\\btop-down\\b"
    reified_contexts:
      - "\\bcentralized\\s+(control|authority|system|management)\\b"
      - "\\bhierarchy\\s+(is|ensures|enables)\\b"
      - "\\bchain\\s+of\\s+command\\b"
      - "\\btop-down\\s+(decision|approach|management)\\b"
      - "\\bneed(s)?\\s+(a\\s+)?hierarchy\\b"
    functional_contexts:
